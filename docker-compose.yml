services:
  postgres:
    image: postgres:16-alpine
    container_name: astravault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: astravault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - astravault-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d astravault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  astravault-postgres-data:
